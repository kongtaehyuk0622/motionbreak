<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- GitHub Pages 처럼 하위 주소에 올릴 때 flutter build web --base-href 로 바뀐다 -->
  <base href="/motionbreak/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="MOTION BREAK – 카메라 체감형 격파 게임. 영상은 기기 안에서만 처리되고 어디에도 전송·저장되지 않습니다.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MOTION BREAK">
  <meta name="theme-color" content="#0B1020">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>MOTION BREAK</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B1020; overflow: hidden; touch-action: none; }
    #mb-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: #fff; font: 600 18px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      text-align: center; padding: 16px;
    }
    #mb-loading b { font-size: 34px; letter-spacing: 2px; color: #FFD54F; }
    #mb-loading small { color: #ffffffaa; font-weight: 400; font-size: 14px; }
    #mb-loading i { width: 46px; height: 46px; border-radius: 50%; border: 5px solid #ffffff33; border-top-color: #FFD54F;
      animation: mb-spin 0.9s linear infinite; }
    @keyframes mb-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #mb-loading i { animation: none; } }
  </style>
</head>
<body>
  <div id="mb-loading">
    <b>MOTION BREAK</b>
    <i></i>
    <span>게임을 불러오는 중…</span>
    <small>처음 한 번은 1분 정도 걸릴 수 있어요 · 영상은 이 기기 안에서만 처리됩니다</small>
  </div>
  <!-- 카메라 + MediaPipe 신체 인식(웹). Flutter 앱보다 먼저 window.motionVision 을 만든다 -->
  <script src="motion_vision.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
