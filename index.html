<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MOTION BREAK</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f17; color: #e8ecf3;
         font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-align: center; }
  h1 { color: #ffc93c; font-size: 28px; margin: 0 0 12px; }
  p { margin: 4px 0; color: #b8c0cc; }
</style>
</head>
<body>
  <main>
    <h1>MOTION BREAK</h1>
    <p>웹 버전은 종료되었습니다.</p>
    <p>안드로이드 앱으로 이용해 주세요.</p>
  </main>
  <script>
    // 예전 웹 버전이 남긴 서비스 워커·캐시가 있으면 지움
    try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())); } catch (e) {}
    try { window.caches && caches.keys().then(ks => ks.forEach(k => caches.delete(k))); } catch (e) {}
  </script>
</body>
</html>
